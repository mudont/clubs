schema: http://localhost:4010/graphql
documents:
  - ./src/**/*.ts
  - ./src/**/*.tsx
  - '!./src/__generated__/**/*'
generates:
  ./src/__generated__/types.ts:
    plugins:
      - add:
          content: '/* eslint-disable */'
      - typescript
      - typescript-operations
      - typescript-react-apollo
    config:
      withHooks: true
      withHOC: false
      withComponent: false
      avoidOptionals:
        field: true
        inputValue: false
        object: false
        defaultValue: false
      skipTypename: false
      enumsAsTypes: true
      scalars:
        DateTime: string
      nonOptionalTypename: true
      preResolveTypes: true
      namingConvention:
        typeNames: pascal-case#pascalCase
        enumValues: upper-case#upperCase

  ./src/__generated__/introspection.json:
    plugins:
      - introspection
    config:
      minify: true

  ./src/__generated__/schema.graphql:
    plugins:
      - schema-ast
    config:
      includeDirectives: true

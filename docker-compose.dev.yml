services:
  # Development database with simpler setup
  db:
    environment:
      POSTGRES_DB: clubs_db
      POSTGRES_USER: clubs
      POSTGRES_PASSWORD: clubs
    ports:
      - '5432:5432'

  # Development Redis without password for simplicity
  redis:
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Development app with hot reload
  app:
    build:
      target: development
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://clubs:clubs@db:5432/clubs_db
      REDIS_URL: redis://redis:6379
    volumes:
      - .:/app
      - /app/node_modules
      - /app/server/node_modules
      - /app/client/node_modules
    command: npm run dev:server
    ports:
      - '4010:4010'
